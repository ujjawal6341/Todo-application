<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Todo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    {% extends 'base.html' %}

    {% block title %} Update Todo {% endblock title %}

    {% block body %}
    <div class="container mt-4">
        <h2>Update your Todo</h2>
        <form action="/update/{{ todo.sno }}" method="post">
            <div class="mb-3">
                <label for="Todos" class="form-label">Todo's</label>
                <input type="text" class="form-control" id="Todos" name="title" value="{{ todo.title }}" required>
            </div>
            <div class="mb-3">
                <label for="Description" class="form-label">Todo's Description</label>
                <input type="text" class="form-control" id="Description" name="desc" value="{{ todo.desc }}" required>
            </div>
            <button type="submit" class="btn btn-outline-dark">Update</button>
            <a href="/" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
    {% endblock body %}

</body>

</html>
